<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f4f0" />
<title>上传照片</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #f6f4f0;
    --card: #ffffff;
    --text: #1e1c19;
    --dim: #77716a;
    --faint: #a49d94;
    --line: #e7e2d9;
    --accent: #b0762f;
    --accent-soft: #f6ecdc;
    --ok: #3f7d56;
    --danger: #b4463f;
  }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 26px 18px 0; }

  .kicker {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; letter-spacing: 0.08em; color: var(--accent);
    background: var(--accent-soft); padding: 4px 10px; border-radius: 999px;
  }
  h1 { font-size: 24px; line-height: 1.3; margin: 14px 0 6px; font-weight: 600; letter-spacing: -0.01em; }
  .note { margin: 0; color: var(--dim); font-size: 13.5px; line-height: 1.65; white-space: pre-wrap; }

  .statcard {
    margin-top: 18px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px;
  }
  .statline { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .statline b { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .statline span { font-size: 12.5px; color: var(--faint); }
  .bar { margin-top: 10px; height: 6px; border-radius: 3px; background: #efeae1; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.35s; }
  .deadline { margin-top: 9px; font-size: 12px; color: var(--faint); }

  .who {
    display: flex; align-items: center; gap: 10px; margin-top: 18px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px;
  }
  .who span { font-size: 13px; color: var(--dim); white-space: nowrap; }
  .who input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font: inherit; font-size: 14px; color: var(--text); padding: 2px 0;
  }
  .who input::placeholder { color: var(--faint); }

  .pick {
    margin-top: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 26px 16px; cursor: pointer;
    background: var(--card); border: 1.5px dashed #d8cfc0; border-radius: 16px;
    transition: border-color 0.15s, background 0.15s;
  }
  .pick:active { background: #fbfaf7; border-color: var(--accent); }
  .pick .icon { width: 34px; height: 34px; color: var(--accent); margin-bottom: 4px; }
  .pick .t { font-size: 15px; font-weight: 600; }
  .pick .s { font-size: 12px; color: var(--faint); }

  .queue { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .item {
    display: flex; gap: 11px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px;
  }
  .thumb {
    width: 46px; height: 46px; border-radius: 8px; object-fit: cover;
    background: #efebe4; flex-shrink: 0;
  }
  .thumb.play { display: flex; align-items: center; justify-content: center; color: var(--faint); }
  .thumb.play svg { width: 21px; height: 21px; }
  .meta { flex: 1; min-width: 0; }
  .meta .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .sub { margin-top: 3px; font-size: 11.5px; color: var(--faint); }
  .mini { margin-top: 6px; height: 3px; background: #efeae1; border-radius: 2px; overflow: hidden; }
  .mini i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s; }
  .state { font-size: 11.5px; flex-shrink: 0; padding-left: 4px; }
  .state.ok { color: var(--ok); }
  .state.dup { color: var(--accent); }
  .state.err { color: var(--danger); cursor: pointer; text-decoration: underline; }
  .state.work { color: var(--faint); }

  .foot { margin-top: 26px; text-align: center; color: var(--faint); font-size: 11.5px; line-height: 1.7; }
  .diag { margin-top: 12px; color: var(--faint); font-size: 11px; }
  .diag summary { cursor: pointer; text-align: center; }
  .diag pre {
    margin: 8px 0 0; padding: 10px 12px; border-radius: 10px;
    background: rgba(0, 0, 0, 0.04); white-space: pre-wrap; word-break: break-all;
    line-height: 1.65; font-size: 10.5px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(12px);
    background: #2a2723; color: #f6f4f0; padding: 9px 16px; border-radius: 10px;
    font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
    max-width: calc(100vw - 40px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <span class="kicker">相册收集</span>
  <h1 id="title">正在连接…</h1>
  <p class="note" id="note"></p>

  <div class="statcard">
    <div class="statline">
      <b id="received">—</b>
      <span id="target"></span>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <div class="deadline" id="deadline"></div>
  </div>

  <label class="who">
    <span>你的名字</span>
    <input id="uploader" maxlength="24" placeholder="方便我认出是谁传的" autocomplete="name" />
  </label>

  <label class="pick" for="file">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="7" width="18" height="13" rx="3" />
      <circle cx="12" cy="13.5" r="3.6" />
      <path d="M8.5 7 10 4.5h4L15.5 7" />
    </svg>
    <span class="t">选择照片或视频</span>
    <span class="s">可以多选，原图 / 原片上传</span>
  </label>
  <input id="file" class="hidden" type="file" accept="image/*,video/*,.heic,.heif" multiple />

  <div class="queue" id="queue"></div>

  <div class="foot">照片和视频直接传到同一局域网里的电脑<br />不经过互联网，关掉页面不会丢已传完的</div>

  <!-- 卡住时让用户能直接说出停在哪一步，比「还是卡」有用得多 -->
  <details class="diag">
    <summary>上传诊断</summary>
    <pre id="diaglog"></pre>
  </details>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  // 口令在路径里（/u/<token>），早期也支持 /u/?t=<token>，两种都认
  var TOKEN = ((location.pathname.match(/^\/u\/([a-f0-9]{6,32})/i) || [])[1] ||
    new URLSearchParams(location.search).get('t') ||
    '').toLowerCase();
  // 分片小一点：单个请求的时长直接决定「弱网下会不会被 45 秒超时误杀」，
  // 而且片越小进度条动得越勤，用户不会盯着「等待中」以为卡死了
  var CHUNK = 256 * 1024;
  var MAX_ACTIVE = 2;
  var queue = [];
  var active = 0;
  var info = null;

  var $ = function (id) { return document.getElementById(id); };
  var nameInput = $('uploader');
  var toastTimer = null;

  // 手机上看不到控制台。把关键步骤记在一个可展开的面板里，
  // 万一还是卡住，点开就能看到停在第几片、那一片等了多久、报了什么错。
  var logs = [];
  function log(msg) {
    var d = new Date();
    var t = [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map(function (n) { return String(n).padStart(2, '0'); })
      .join(':');
    logs.push(t + '  ' + msg);
    if (logs.length > 80) logs.shift();
    var el = $('diaglog');
    if (el) el.textContent = logs.join('\n');
  }

  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  function fmtSize(n) {
    if (n > 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
    return Math.max(1, Math.round(n / 1024)) + ' KB';
  }

  function fmtDeadline(ts) {
    if (!ts) return '没有截止时间';
    var d = new Date(ts);
    return '截止 ' + d.getMonth() + 1 + ' 月 ' + d.getDate() + ' 日 ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function renderInfo(data) {
    info = data;
    $('title').textContent = data.name;
    $('note').textContent = data.note || '';
    $('note').classList.toggle('hidden', !data.note);
    $('received').textContent = '已收 ' + data.received + ' 张';
    $('target').textContent = data.targetCount ? '目标 ' + data.targetCount + ' 张' : '';
    $('deadline').textContent = fmtDeadline(data.deadlineAt) + (data.state === 'closed' ? ' · 已结束' : '');
    var pct = data.targetCount ? Math.min(100, Math.round((data.received / data.targetCount) * 100)) : 0;
    $('fill').style.width = pct + '%';
    if (data.state === 'closed') {
      $('file').disabled = true;
      document.querySelector('.pick').classList.add('hidden');
    }
  }

  async function loadInfo(silent) {
    try {
      var res = await req('GET', '/api/info?t=' + encodeURIComponent(TOKEN), null, {
        timeout: API_TIMEOUT,
      });
      if (res.status !== 200) throw new Error('HTTP ' + res.status);
      var info2 = parseJson(res.text);
      renderInfo(info2);
      if (!silent) log('连接成功 · 已收 ' + info2.received + ' 张');
    } catch (e) {
      if (!silent) {
        $('title').textContent = '链接不可用';
        $('note').textContent = '这个上传地址已失效，或者电脑上的收集服务没有启动。请让发起人重新给你链接。';
      }
    }
  }

  function setState(item, text, cls) {
    item.el.state.textContent = text;
    item.el.state.className = 'state ' + (cls || '');
  }

  function setProgress(item, ratio) {
    item.progressAt = Date.now();
    item.el.mini.style.width = Math.round(ratio * 100) + '%';
  }

  // 副标题平时显示文件大小，传的过程中显示「第几片 / 共几片」。
  // 卡住时用户能直接报出停在哪一片，不用靠猜。
  function setSub(item, text) {
    if (item.el.sub) item.el.sub.textContent = text;
  }

  // 所有请求都走 XMLHttpRequest，不用 fetch。
  //
  // 原因很具体：iOS 上 fetch 一旦挂住，AbortController.abort() 经常叫不醒
  // 它；更糟的是被 abort 过的连接会被后续请求继续复用，整条队列跟着卡死。
  // 表现就是传了一两个分片之后再也不动 —— 服务端的 .part 停在 256KB 的整数倍。
  // XHR 有原生 timeout，到点会真的结束请求，abort() 也是立刻生效。
  // 请求挂多久就占着并发槽多久（最多 2 个），挂死两个之后后面全停在「等待中」，
  // 所以超时必须真的能生效。
  var REQ_TIMEOUT = 20000; // 单片 256KB，20 秒相当于 13KB/s 的下限
  var API_TIMEOUT = 20000;
  var inflight = [];

  function req(method, url, body, opts) {
    opts = opts || {};
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      var isText = typeof body === 'string';
      xhr.open(method, url, true);
      xhr.timeout = opts.timeout || REQ_TIMEOUT;
      if (isText) xhr.setRequestHeader('content-type', 'application/json');
      var rec = { xhr: xhr, at: Date.now() };
      inflight.push(rec);
      // 记在条目上，看门狗判定卡死时能把这条请求真正掐掉，
      // 免得旧请求和新一轮撞在一起、同一个分片写两遍
      if (opts.owner) opts.owner.xhr = xhr;
      var drop = function () {
        var i = inflight.indexOf(rec);
        if (i >= 0) inflight.splice(i, 1);
        if (opts.owner && opts.owner.xhr === xhr) opts.owner.xhr = null;
      };
      xhr.onload = function () {
        drop();
        resolve({ status: xhr.status, text: xhr.responseText || '' });
      };
      xhr.onerror = function () { drop(); reject(new Error('网络中断')); };
      xhr.ontimeout = function () { drop(); reject(new Error('网络超时')); };
      xhr.onabort = function () { drop(); reject(new Error('已取消')); };
      if (opts.onUpload) {
        xhr.upload.onprogress = function (e) {
          if (!e.lengthComputable) return;
          rec.at = Date.now();
          opts.onUpload(e.loaded, e.total);
        };
      }
      xhr.send(body == null ? null : body);
    });
  }

  function parseJson(text) {
    try {
      return JSON.parse(text || '{}');
    } catch (e) {
      return {};
    }
  }

  // 切回前台时，把已经挂了一会儿的请求立刻掐掉重来，不用干等超时。
  // 服务端按 offset 续传，已经收到的字节不会白传。
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    var now = Date.now();
    inflight.slice().forEach(function (rec) {
      if (now - rec.at > 8000) {
        try { rec.xhr.abort(); } catch (e) { /* 已经结束 */ }
      }
    });
  });

  async function postJSON(url, body, timeout) {
    var res = await req('POST', url, JSON.stringify(body), { timeout: timeout || API_TIMEOUT });
    var json = parseJson(res.text);
    if (res.status < 200 || res.status >= 300) {
      var err = new Error(json.error || ('HTTP ' + res.status));
      err.status = res.status;
      err.data = json;
      throw err;
    }
    return json;
  }

  // 把整份文件先读进内存，后面所有分片都从内存里切。
  //
  // iOS 从「照片图库」拿到的 File 并不是普通本地文件：每一次 slice() 都可能
  // 要回到相册甚至 iCloud 去取那一段，取不到就一声不响地吊着 —— 这才是
  // 「一两片之后就再也不动」最像的原因（913KB 的照片也只传了 1 片）。
  // 一次读完，后续就完全不再碰相册。
  var MEM_LIMIT = 32 * 1024 * 1024;
  // 一次选二十张照片时不能每张都整份读进内存，手机上会把页面撑崩：
  // 单张 32MB、总量 64MB 封顶，超出的退回按片读
  var MEM_TOTAL = 64 * 1024 * 1024;
  var bufferedBytes = 0;

  function readWholeFile(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      var timer = setTimeout(function () {
        try { fr.abort(); } catch (e) { /* 已经结束 */ }
        reject(new Error('读取文件超时'));
      }, 60000);
      fr.onload = function () { clearTimeout(timer); resolve(fr.result); };
      fr.onerror = function () { clearTimeout(timer); reject(new Error('读取文件失败')); };
      fr.onabort = function () { clearTimeout(timer); reject(new Error('读取已取消')); };
      fr.readAsArrayBuffer(file);
    });
  }

  function sliceOf(item, offset, end) {
    if (item.buf) return new Blob([new Uint8Array(item.buf, offset, end - offset)]);
    return item.file.slice(offset, end);
  }

  async function uploadOnce(item, gen) {
    // gen 是这一轮的代号。看门狗判定卡死后会把 item.gen 递增，旧循环
    // 下次检查时静默退出，免得和新起的那一轮抢着写同一个文件
    var uploader = nameInput.value.trim();
    var init = await postJSON('/api/init', {
      token: TOKEN,
      name: item.file.name,
      size: item.file.size,
      lastModified: item.file.lastModified || 0,
      uploader: uploader,
    });
    if (item.gen !== gen) return false;
    var offset = init.offset || 0;
    var total = Math.max(1, Math.ceil(item.file.size / CHUNK));
    log(item.file.name + ' · ' + fmtSize(item.file.size) + ' · 从 ' + offset + ' 字节开始');
    setProgress(item, offset / item.file.size);
    // 别让它在第一片传完之前一直挂着「等待中」——用户会以为卡死了
    setState(
      item,
      offset > 0 ? Math.round((offset / item.file.size) * 100) + '%' : '上传中…',
      'work'
    );

    var roomy =
      !item.buf && !item.noBuf && item.file.size <= MEM_LIMIT &&
      bufferedBytes + item.file.size <= MEM_TOTAL;
    if (roomy) {
      setState(item, '准备中…', 'work');
      item.progressAt = Date.now();
      try {
        item.buf = await readWholeFile(item.file);
        bufferedBytes += item.file.size;
      } catch (e) {
        // 读不进内存就退回按片读，至少还能继续，别把这条路彻底堵死
        item.noBuf = true;
      }
      if (item.gen !== gen) return false;
      setState(item, Math.round((offset / item.file.size) * 100) + '%', 'work');
    }

    while (offset < item.file.size) {
      if (item.gen !== gen) return false;
      var end = Math.min(offset + CHUNK, item.file.size);
      var blob = sliceOf(item, offset, end);
      // iOS 从「照片图库」里多选时，File 偶尔读不出内容（slice 得到空 Blob）。
      // 不挡住的话服务端 received 不增长、客户端 offset 也不变，
      // 就会无限重发空请求，界面上一直「等待中」——比报错更难查。
      if (!blob.size) throw new Error('读取这张文件失败，请重新选择');
      var startedAt = Date.now();
      var res = await req(
        'PUT',
        '/api/chunk?uploadId=' + encodeURIComponent(init.uploadId) + '&offset=' + offset,
        blob,
        {
          timeout: REQ_TIMEOUT,
          owner: item,
          // 片内每收到一点字节就刷新一次「活着」的时间戳，
          // 免得大文件在慢网下被看门狗误判成卡死
          onUpload: function () {
            item.progressAt = Date.now();
          },
        }
      );
      var data = parseJson(res.text);
      if (res.status === 409 && typeof data.offset === 'number') {
        // 服务端说它对不上（上一次请求断在半路，只写了半片）。
        // 以它为准接着传，别拿着自己的 offset 死磕 409
        offset = data.offset;
        continue;
      }
      if (res.status < 200 || res.status >= 300) {
        throw new Error(data.error || ('上传中断（' + res.status + '）'));
      }
      // 服务端一个字节都没吃进去，继续循环也只是空转
      if (!(data.received > offset)) throw new Error('上传没有进展');
      offset = data.received;
      log(
        '  片 ' + Math.ceil(offset / CHUNK) + '/' + total + ' · 已收 ' + offset + ' 字节 · ' +
        (Date.now() - startedAt) + 'ms'
      );
      setProgress(item, offset / item.file.size);
      setSub(item, fmtSize(item.file.size) + ' · ' + (Math.ceil(offset / CHUNK) || 1) + '/' + total);
      setState(item, Math.round((offset / item.file.size) * 100) + '%', 'work');
    }

    if (item.gen !== gen) return false;
    // 入库要算 sha1、复制文件，视频还要读出首帧，比传分片慢得多
    var done = await postJSON('/api/complete', { uploadId: init.uploadId }, 120000);
    // 这里不再看 gen：complete 一旦拿到 200 就说明服务端已经入库了，
    // 无条件收尾，免得看门狗刚好插手时又整份重传一遍
    item.done = true;
    if (item.buf) {
      item.buf = null; // 早一点把几十 MB 的内存还回去
      bufferedBytes -= item.file.size;
    }
    setProgress(item, 1);
    setSub(item, fmtSize(item.file.size));
    log(item.file.name + (done.deduped ? ' 已在库里（跳过）' : ' 入库完成'));
    if (done.deduped) {
      setState(item, '已存在', 'dup');
    } else {
      setState(item, '已收', 'ok');
    }
    loadInfo(true);
    return true;
  }

  async function runItem(item, gen) {
    for (var attempt = 0; attempt < 3; attempt++) {
      if (item.gen !== gen) return;
      try {
        await uploadOnce(item, gen);
        return;
      } catch (e) {
        if (item.gen !== gen) return; // 已经被看门狗接管，别再插手
        log(item.file.name + ' 出错：' + ((e && e.message) || e));
        if (attempt === 2) {
          setState(item, '失败 · 点此重试', 'err');
          item.el.state.onclick = function () {
            item.el.state.onclick = null;
            item.attempts = 0;
            setState(item, '等待中', 'work');
            pump();
          };
          return;
        }
        // 让用户看见它在自救，而不是一直挂着「等待中」不动
        setState(item, '重试中…', 'work');
        await new Promise(function (r) { setTimeout(r, 1200 * (attempt + 1)); });
      }
    }
  }

  function pickNext() {
    for (var i = 0; i < queue.length; i++) {
      var it = queue[i];
      if (!it.done && !it.running) return it;
    }
    return null;
  }

  // 必须把 item 作为参数传进来再挂回调。以前 while 里写 var next，
  // 而 var 是函数作用域 —— 一次 pump 启动 A、B 两张时，两个 finally
  // 拿到的都是同一个 next（B）：A 结束时把还在传的 B 标成空闲，B 被
  // 重复启动；A 自己的 running 永远是 true，失败后连「重试」都点不动。
  function startItem(item) {
    item.running = true;
    item.progressAt = Date.now();
    active++;
    var gen = item.gen;
    runItem(item, gen).finally(function () {
      if (item.gen !== gen) return; // 看门狗已经释放过这个槽了
      item.running = false;
      active--;
      pump();
    });
  }

  function pump() {
    while (active < MAX_ACTIVE) {
      var next = pickNext();
      if (!next) return;
      startItem(next);
    }
  }

  // 最后的兜底，只认「多久没有新进展」这一件事，不依赖任何浏览器 API。
  // iOS 上 fetch 可能永远不落地（连接被路由器/系统静默丢弃时 abort 也叫
  // 不醒它），那样并发槽就再也不会释放。超时就把这一轮作废：gen 递增让
  // 旧循环自己退出，槽位立刻还回去重新排队，从服务端已收的字节接着传。
  var STALL_MS = 25000;
  var MAX_ATTEMPTS = 5;

  setInterval(function () {
    var now = Date.now();
    for (var i = 0; i < queue.length; i++) {
      var it = queue[i];
      if (!it.running || it.done) continue;
      if (now - (it.progressAt || 0) < STALL_MS) continue;
      log(
        it.file.name + ' · ' + Math.round((now - (it.progressAt || 0)) / 1000) +
        ' 秒没有进展，作废这一轮重传'
      );
      // 先让旧循环作废，再把还挂着的请求掐掉：XHR 的 abort 是立刻生效的，
      // 不掐的话它和重新起的那一轮会同时往同一个分片 offset 上写
      it.gen++;
      try { if (it.xhr) it.xhr.abort(); } catch (e) { /* 已经结束 */ }
      it.running = false;
      it.attempts = (it.attempts || 0) + 1;
      active--;
      if (it.attempts > MAX_ATTEMPTS) {
        setState(it, '失败 · 点此重试', 'err');
        (function (item) {
          item.el.state.onclick = function () {
            item.el.state.onclick = null;
            item.attempts = 0;
            setState(item, '等待中', 'work');
            pump();
          };
        })(it);
      } else {
        setState(it, '重试中…', 'work');
      }
      pump();
    }
  }, 2000);

  function addFiles(files) {
    Array.prototype.forEach.call(files, function (file) {
      // 视频也要收：服务端 ingestUpload 里有 isVideo 分支，会原样入库，
      // 尺寸和首帧由渲染层补。所以这里的过滤不能只认 image/*
      var isVideo = file.type.indexOf('video/') === 0 ||
        /\.(mp4|mov|m4v|3gp|avi|mkv|webm|wmv)$/i.test(file.name);
      if (!isVideo && !file.type.startsWith('image/') && !/\.(hei[cf])$/i.test(file.name)) return;

      var el = document.createElement('div');
      el.className = 'item';
      var thumb;
      if (isVideo) {
        // 视频没法直接塞进 <img>，给个播放图标；顺便避免 createObjectURL 泄漏
        thumb = document.createElement('div');
        thumb.className = 'thumb play';
        thumb.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">' +
          '<rect x="3" y="5" width="18" height="14" rx="2.5"/>' +
          '<path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>';
      } else {
        thumb = document.createElement('img');
        thumb.className = 'thumb';
        thumb.alt = '';
        thumb.src = URL.createObjectURL(file);
      }
      var meta = document.createElement('div');
      meta.className = 'meta';
      var nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = file.name;
      var sub = document.createElement('div');
      sub.className = 'sub';
      sub.textContent = fmtSize(file.size);
      var mini = document.createElement('div');
      mini.className = 'mini';
      var fill = document.createElement('i');
      mini.appendChild(fill);
      meta.appendChild(nm);
      meta.appendChild(sub);
      meta.appendChild(mini);
      var state = document.createElement('span');
      state.className = 'state work';
      state.textContent = '等待中';
      el.appendChild(thumb);
      el.appendChild(meta);
      el.appendChild(state);
      $('queue').appendChild(el);

      queue.push({
        file: file,
        el: { root: el, mini: fill, state: state, sub: sub },
        done: false,
        running: false,
        gen: 0,
        attempts: 0,
        progressAt: 0,
        buf: null,
        noBuf: false,
      });
    });
    if (queue.length) pump();
  }

  $('file').addEventListener('change', function (e) {
    // 先把 File 引用拷出来，再清空 input（清空是为了能重复选同一批）。
    // iOS 上清空 value 之后，原先那份 FileList 里的 File 有读不出内容的情况
    var picked = Array.prototype.slice.call(e.target.files);
    e.target.value = '';
    addFiles(picked);
  });

  var saved = localStorage.getItem('vault-uploader');
  if (saved) nameInput.value = saved;
  nameInput.addEventListener('change', function () {
    localStorage.setItem('vault-uploader', nameInput.value.trim());
  });

  loadInfo(false);
})();
</script>
</body>
</html>
