# pnpm 11 把「依赖的构建脚本没被批准」当成硬错误（ERR_PNPM_IGNORED_BUILDS，
# install 直接 exit 1），而 pnpm dev 会先校验依赖树，于是连开发模式都起不来。
#
# 这两个包必须允许跑 postinstall：
#   esbuild             装平台相关的二进制，electron-vite 全靠它
#   electron-winstaller 打包工具链的辅助依赖
#
# electron 本身在 pnpm 的默认允许名单里，不用写；sharp 走 @img 预编译包，也不需要。
# 改完要重新 pnpm install，脚本才会补跑。
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true

# electron-builder 26.18 的 app-builder-lib 调用了 @electron/get 4.x 才有的
# ElectronDownloadCacheMode，但自家依赖声明写的是 ^3.0.0（3.x 只有 CacheMode）。
# pnpm 严格按声明装 3.x，于是打包必挂在
#   Cannot read properties of undefined (reading 'ReadWrite')
# npm 的扁平提升碰巧掩盖了这个问题。这里只钉 app-builder-lib 这一支，
# electron 自己用的 5.x 不能动（API 不同）。
# 注意：pnpm 11 不再读 package.json 里的 pnpm.overrides，只认这个文件；
# CI 走 npm ci，对应配置写在 package.json 的 overrides 里。
overrides:
  'app-builder-lib>@electron/get': 4.0.3
